<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABI — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cabinet Grotesk',sans-serif;background:#060608;color:#f2f2f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

body::before{content:'';position:fixed;top:-20%;left:-10%;width:60vw;height:60vw;background:radial-gradient(ellipse,rgba(212,245,60,0.05) 0%,transparent 70%);pointer-events:none;}
body::after{content:'';position:fixed;bottom:-20%;right:-10%;width:50vw;height:50vw;background:radial-gradient(ellipse,rgba(100,80,255,0.06) 0%,transparent 70%);pointer-events:none;}

.card{background:#0d0d14;border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:48px 44px;width:100%;max-width:420px;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.5);animation:slideUp 0.5s cubic-bezier(0.4,0,0.2,1) both;}

.card::before{content:'';position:absolute;top:0;left:40px;right:40px;height:1px;background:linear-gradient(90deg,transparent,rgba(212,245,60,0.5),transparent);}

.logo{display:flex;align-items:center;gap:12px;margin-bottom:36px;}
.logo-icon{width:46px;height:46px;background:#d4f53c;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#060608;box-shadow:0 0 28px rgba(212,245,60,0.4);flex-shrink:0;}
.logo-name{font-size:20px;font-weight:900;letter-spacing:-0.5px;}
.logo-name span{color:#d4f53c;}
.logo-sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:#5a5a72;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}

h1{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:8px;}
h1 span{color:#d4f53c;}
.subtitle{font-size:14px;color:#8888a4;margin-bottom:32px;}

.form-group{margin-bottom:16px;}
label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8888a4;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;}
input{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 16px;color:#f2f2f8;font-family:'Cabinet Grotesk',sans-serif;font-size:15px;font-weight:500;outline:none;transition:all 0.2s;}
input:focus{border-color:#d4f53c;box-shadow:0 0 0 3px rgba(212,245,60,0.1);}
input::placeholder{color:#5a5a72;}

.btn{width:100%;background:#d4f53c;color:#060608;border:none;border-radius:12px;padding:14px;font-family:'Cabinet Grotesk',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:all 0.2s;margin-top:8px;letter-spacing:0.2px;}
.btn:hover{background:#b8d930;transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,245,60,0.3);}
.btn:active{transform:translateY(0);}

.error{background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.25);border-radius:10px;padding:12px 16px;font-size:13px;color:#ff3b5c;margin-bottom:16px;display:none;animation:fadeUp 0.3s ease both;}

.footer{text-align:center;margin-top:24px;font-size:12px;color:#5a5a72;}

@keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">ABI</div>
    <div>
      <div class="logo-name">A.B. <span>IND.</span></div>
      <div class="logo-sub">Invoice Manager</div>
    </div>
  </div>

  <h1>Welcome <span>back.</span></h1>
  <p class="subtitle">Sign in to access A.B. Industries invoicing</p>

  <div class="error" id="err">Invalid username or password</div>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username" autocapitalize="off">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
  </div>

  <button class="btn" onclick="doLogin()" id="login-btn">Sign In →</button>

  <div class="footer">A.B. Industries · Kolhapur</div>
</div>

<script>
document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

async function doLogin() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('err');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if(!username || !password) {
    err.textContent = 'Please enter username and password';
    err.style.display = 'block'; return;
  }

  btn.textContent = 'Signing in...';
  btn.disabled = true;
  err.style.display = 'none';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(data.success) {
      window.location.href = '/';
    } else {
      err.textContent = 'Invalid username or password';
      err.style.display = 'block';
      btn.textContent = 'Sign In →';
      btn.disabled = false;
    }
  } catch(e) {
    err.textContent = 'Connection error. Please try again.';
    err.style.display = 'block';
    btn.textContent = 'Sign In →';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
